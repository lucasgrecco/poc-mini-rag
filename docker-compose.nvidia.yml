# Optional overlay: reserves an NVIDIA GPU for the `cli` service.
#
# Requires the nvidia-container-toolkit on the host. Without it, `up` fails with
# "could not select device driver nvidia with capabilities: [[gpu]]" — which is
# exactly why this reservation does not live in the base compose file.
#
# Usage:  make run GPU=nvidia
#    or:  docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# A host without a GPU needs nothing: torch falls back to CPU on its own.
services:
  cli:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
