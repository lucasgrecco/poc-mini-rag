# Optional overlay: hands the AMD GPUs to the `cli` service via ROCm.
#
# Usage:  make run GPU=rocm
#    or:  docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
#
# There is no dedicated Dockerfile: the PyTorch ROCm wheels bundle the ROCm runtime
# themselves. The host only needs the amdgpu kernel driver — a ROCm install on the
# host is not a prerequisite.
#
# `device="cuda"` is still the right device: ROCm exposes HIP through torch's CUDA
# API, so `torch.cuda.is_available()` returns True on a Radeon and the application
# code carries no AMD branch.
services:
  cli:
    devices:
      # /dev/kfd is the compute interface; /dev/dri exposes the card nodes.
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    # ROCm uses shared memory between processes for transfers.
    ipc: host
    environment:
      # Both 7900 XTX cards are gfx1100, officially supported by ROCm — no
      # HSA_OVERRIDE_GFX_VERSION here. That override exists for cards outside the
      # support list, and setting it when it isn't needed masks real errors.
      #
      # sentence-transformers loads the model onto a single card. Uncomment to
      # pick which one, or to leave one of the two free:
      # - HIP_VISIBLE_DEVICES=0
      - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
