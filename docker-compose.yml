services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rag_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  cli:
    build: .
    command: sleep infinity
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Sem reserva de GPU aqui de propósito: `driver: nvidia` faz o `up` falhar em
    # qualquer host sem o nvidia-container-toolkit. A reserva vive em
    # docker-compose.nvidia.yml e entra por sobreposição — ver o Makefile.

volumes:
  db_data:
