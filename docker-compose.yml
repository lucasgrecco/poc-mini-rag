services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rag_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  cli:
    build: .
    command: sleep infinity
    volumes:
      - .:/app
      # The uv cache would otherwise live in the container's writable layer and be
      # discarded on every recreate — including every GPU-mode switch, which then
      # re-downloads the whole CUDA stack and, under ROCm, the ROCm torch on top.
      - uv_cache:/root/.cache/uv
    working_dir: /app
    environment:
      # The uv cache volume and the /app bind mount are different filesystems, so uv
      # cannot hardlink between them. Say so up front rather than take the fallback
      # plus a warning on every install.
      - UV_LINK_MODE=copy
    # Optional: a fresh clone has no .env and must still come up. Without it
    # the app runs entirely on local resources -- see `make run` output.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    # No GPU reservation here, on purpose: `driver: nvidia` makes `up` fail on any
    # host without the nvidia-container-toolkit. The reservation lives in
    # docker-compose.nvidia.yml and comes in as an overlay — see the Makefile.

volumes:
  db_data:
  uv_cache:
