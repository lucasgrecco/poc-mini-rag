services:
  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rag_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  cli:
    build: .
    command: sleep infinity
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
